# Lors d'un push vers la prod lol

name: CI/CD for prod

on:
  push:
    branches:
      - prod


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Lint du code
        run: npm run lint

      - name: Build de production
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload des artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/dist/climactif/browser'
  deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: Deploy sur GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v2
