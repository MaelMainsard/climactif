name: CI/CD for pull request
on:
  pull_request:
    branches:
     - dev

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Get Vercel preview URL
        id: vercel
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const vercelComment = comments.data.find(c =>
              c.user?.login === 'vercel[bot]' && c.body?.includes('Visit Preview')
            );

            if (vercelComment) {
              const match = vercelComment.body.match(/\[Visit Preview\]\((.*?)\)/);
              if (match) {
                core.setOutput('preview-url', match[1]);
              }
            }

#      - name: Run Pa11y Audit
#        uses: ./accessibility/pa11y-ci
#        with:
#          github-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Run Ecoindex Audit
        uses: ./accessibility/ecoindex-ci
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
            vercel-url: ${{ steps.vercel.outputs.preview-url }}
  lighthouseci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Lighthouseci Audit
        uses: ./accessibility/lighthouse-ci
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}



