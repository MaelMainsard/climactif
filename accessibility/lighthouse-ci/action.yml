name: 'Lighthouse Audit'
description: 'Run lighthouse audit and create PR comment'
author: 'maelmainsard'

inputs:
  github-token:
    description: 'GitHub token for creating checks'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
    - name: Audit URLs using Lighthouse
      uses: treosh/lighthouse-ci-action@v12
      with:
        configPath: './accessibility/lighthouse-ci/.lighthouserc.js'
        uploadArtifacts: true
        temporaryPublicStorage: true
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ inputs.github-token }}

