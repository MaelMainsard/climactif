name: 'Lighthouse Audit'
description: 'Run lighthouse audit and create PR comment'
author: 'maelmainsard'

inputs:
  github-token:
    description: 'GitHub token for creating checks'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build project
      shell: bash
      run: npm run build

    - name: Run Lighthouse CI
      shell: bash
      run: npx lhci autorun --config=./accessibility/lighthouse-ci/.lighthouserc.js
