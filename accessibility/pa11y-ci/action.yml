name: 'Pa11y Audit'
description: 'Run pa11y-ci audit and create PR comment'
author: 'maelmainsard'

inputs:
  github-token:
    description: 'GitHub token for creating checks'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install dependencies and run pa11y
      id: pa11y
      shell: bash
      run: |
        npm install -g pa11y-ci pa11y-ci-reporter-html
        pa11y-ci --config ./accessibility/pa11y-ci/.pa11yci.json || true
        PA11Y_JSON=$(cat paa1y-results.json)
        echo "result=$PA11Y_JSON" >> $GITHUB_OUTPUT

    - name: Create PR Check
      uses: actions/github-script@v7
      env:
        PA11Y_RESULT: ${{ steps.pa11y.outputs.result }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pa11yData = JSON.parse(process.env.PA11Y_RESULT);

          const conclusion = pa11yData.errors === 0 ? 'success' : 'failure';
          const emoji = pa11yData.errors === 0 ? '✅' : '❌';

          let issuesText = '';
          if (pa11yData.errors > 0) {
            Object.entries(pa11yData.results).forEach(([url, issues]) => {
              issuesText += `\n**${url}:**\n`;
              issues.forEach((issue, i) => {
                issuesText += `${i + 1}. **${issue.code}**: ${issue.message}\n   Element: \`${issue.selector}\`\n\n`;
              });
            });
          }

          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Pa11y Accessibility Report',
            head_sha: context.payload.pull_request.head.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: `${emoji} Accessibility: ${pa11yData.errors} error${pa11yData.errors !== 1 ? 's' : ''} found`,
              summary: `Tested ${pa11yData.total} page${pa11yData.total !== 1 ? 's' : ''} - ${pa11yData.passes} passed, ${pa11yData.errors} failed`,
              text: `## Accessibility Test Results

          **Summary:** ${pa11yData.errors === 0 ? 'All tests passed!' : `${pa11yData.errors} accessibility issues found`}

          ${issuesText}

          ${pa11yData.errors > 0 ? '💡 **Tip:** Fix these issues to improve accessibility for all users.' : '🎉 **Great work!** No accessibility issues detected.'}`
            }
          });
