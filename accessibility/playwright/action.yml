name: 'Playwright + Axe-core Audit'
description: 'Run Playwright + Axe-core audit and create PR comment'
author: 'maelmainsard'

inputs:
  github-token:
    description: 'GitHub token for creating checks'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run test
      shell: bash
      id: test
      run: |
        npm run test:e2e || true
        RESULT_JSON=$(cat playwright-results.json)
        RESULT_SUMMARY=$(cat playwright-summary.txt)

        STATS_ONLY=$(echo "$RESULT_JSON" | jq '.stats')

        echo "json<<EOF" >> $GITHUB_OUTPUT
        echo "$STATS_ONLY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$RESULT_SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create PR Check
      uses: actions/github-script@v7
      env:
        RESULT_JSON: ${{ steps.test.outputs.json }}
        RESULT_SUMMARY: ${{ steps.test.outputs.summary }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const summary = process.env.RESULT_SUMMARY;
          const json = JSON.parse(process.env.RESULT_JSON);
          const failed = json.stats.unexpected != 0;

          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Playwright Accessibility Report',
            head_sha: context.payload.pull_request.head.sha,
            status: 'completed',
            conclusion: failed ? 'failure' : 'success',
            output: {
              title: `🎭 Playwright Accessibility Report completed`,
              summary: 'Accessibility tests completed',
              text: `## 🎭 Playwright Accessibility Test Report

          ${summary}

          You can view more detail by executing npm run test:e2e locally`
          }
          });
