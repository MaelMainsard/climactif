name: 'Playwright + Axe-core Audit'
description: 'Run Playwright + Axe-core audit and create PR comment'
author: 'maelmainsard'

inputs:
  github-token:
    description: 'GitHub token for creating checks'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Run test
      shell: bash
      run: |
        npm run test:e2e || true

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ inputs.github-token }}
        publish_dir: ./playwright-report
        destination_dir: reports/${{ github.run_id }}

    - name: Create PR Check
      uses: actions/github-script@v7
      if: always()
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const runId = context.runId;
          const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

          const repoName = context.repo.repo;
          const owner = context.repo.owner;
          const pagesUrl = `https://${owner}.github.io/${repoName}/reports/${runId}/`;

          github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Playwright Accessibility Report',
            head_sha: context.payload.pull_request.head.sha,
            status: 'completed',
            conclusion: 'success',
            output: {
              title: `🎭 Playwright Accessibility Report`,
              summary: 'Accessibility tests completed successfully',
              text: `## 🎭 Playwright Accessibility Test Report

          🌐 **View Report Online**: [${pagesUrl}](${pagesUrl})
          📦 **Download Artifact**: [${artifactUrl}](${artifactUrl})

          The report is now accessible directly in your browser!`
            }
          });
