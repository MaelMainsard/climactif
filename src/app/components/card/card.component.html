<p-card class="p-4">
  <!-- Horizontal layout -->
  <div *ngIf="layout === 'horizontal'" class="flex items-center gap-4">
    <span class="text-2xl">{{ header }}</span>
    <span class="flex justify-between items-center w-full">
      <h3 class="text-lg font-semibold">{{ title }}</h3>
      <p class="text-sm">{{ text }}</p>
    </span>
  </div>

  <!-- Vertical layout -->
  <div *ngIf="layout === 'vertical'" class="flex flex-col items-start gap-1">
    <span class="text-2xl">{{ header }}</span>
    <h3 class="text-lg font-semibold">{{ title }}</h3>
    <p class="text-sm">{{ text }}</p>
  </div>
</p-card>
