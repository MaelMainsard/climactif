<div class="mood-form flex flex-col px-8 py-8 gap-6 rounded-2xl">
  <div [formGroup]="moodForm">
    <div class="flex flex-col gap-8">
      <div class="flex flex-col gap-4">
        <h1 class="font-semibold text-black">Quel est votre mood du moment ?</h1>
        <div class="flex flex-col gap-2">
          <div class="flex flex-wrap justify-center gap-2">
            <button
              *ngFor="let keyword of keywords"
              type="button"
              (click)="toggleKeyword(keyword)"
              [class.selected]="isKeywordSelected(keyword)"
              class="mood-chip px-4 py-1 rounded-full border cursor-pointer"
            >
              {{ keyword.name }}
            </button>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2 mt-2">
        <p-slider
          id="color"
          formControlName="color"
          styleClass="color-slider"
          (onChange)="onColorChanged($event.value)"
        ></p-slider>
      </div>

      <textarea
        pTextarea
        id="description"
        formControlName="description"
        [(ngModel)]="value"
        rows="2"
        class="mood-textarea w-full p-3 placeholder:text-black/60 bg-gray-50/20 border-0 rounded-lg text-black"
        placeholder="Une impression ?"
      >
      </textarea>
    </div>

    <div class="button-row flex items-center gap-4 mt-8">
      <p-button label="Annuler" (click)="onCancel()" [text]="true" class="w-full" />
      <p-button label="Publier" (click)="onSave()" class="w-full" />
    </div>
  </div>
</div>
