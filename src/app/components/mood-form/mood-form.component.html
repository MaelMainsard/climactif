<div
  class="mood-form flex flex-col px-8 py-8 gap-6 rounded-2xl"
  role="form"
  aria-labelledby="moodform-title"
  aria-describedby="moodform-desc"
  aria-modal="true"
>
  <div [formGroup]="moodForm">
    <div class="flex flex-col gap-8">
      <div class="flex flex-col gap-8">
        <h1 id="moodform-title" class="text-black">
          Prenez un moment pour vous. Partagez ce que vous ressentez en toute bienveillance.
        </h1>
        <p id="moodform-desc" class="sr-only">
          Ce formulaire vous permet de décrire votre humeur, de choisir des mots-clés et une couleur pour l'exprimer.
        </p>
        <fieldset>
          <legend class="sr-only">Mots-clés</legend>
          <div
            class="flex flex-wrap justify-center gap-2"
            role="group"
            aria-label="Mots-clés"
            [attr.aria-required]="true"
            [attr.aria-invalid]="moodForm.get('keywords')?.invalid && moodForm.get('keywords')?.touched"
          >
            <button
              *ngFor="let keyword of keywords"
              type="button"
              (click)="toggleKeyword(keyword)"
              [class.selected]="isKeywordSelected(keyword)"
              class="mood-chip px-4 py-1 rounded-full border cursor-pointer"
              [attr.aria-pressed]="isKeywordSelected(keyword)"
              [attr.aria-label]="keyword.name"
              tabindex="0"
            >
              {{ keyword.name }}
            </button>
          </div>
        </fieldset>
      </div>

      <div class="flex flex-col gap-2 mt-2">
        <label for="color" class="sr-only">Couleur</label>
        <p-slider
          id="color"
          formControlName="color"
          styleClass="color-slider"
          (onChange)="onColorChanged($event.value)"
          [attr.aria-valuenow]="moodForm.get('color')?.value"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Sélectionnez une couleur pour votre humeur"
        >
        </p-slider>
      </div>

      <div class="flex flex-col gap-2 mt-2">
        <label for="description" class="sr-only">Description</label>
        <textarea
          pTextarea
          id="description"
          formControlName="description"
          [(ngModel)]="value"
          rows="2"
          class="mood-textarea w-full p-3 placeholder:text-black/60 bg-gray-50/20 border-0 rounded-lg text-black"
          placeholder="Décrivez ce que vous ressentez..."
          aria-required="true"
          [attr.aria-invalid]="moodForm.get('description')?.invalid && moodForm.get('description')?.touched"
          aria-describedby="moodform-desc"
        >
        </textarea>
      </div>
    </div>

    <div class="button-row flex items-center gap-4 mt-8">
      <p-button label="Annuler" (click)="onCancel()" [text]="true" class="w-full" aria-label="Annuler" />
      <p-button label="Publier" (click)="onSave()" class="w-full" aria-label="Publier" />
    </div>
  </div>
</div>
