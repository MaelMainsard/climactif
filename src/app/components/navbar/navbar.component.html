<p-menubar [model]="items">
  <ng-template pTemplate="item" let-item>
    <a [routerLink]="item.routerLink" class="p-menubar-item-link">
      <span class="ml-2">{{ item.label }}</span>
    </a>
  </ng-template>
  <ng-template #end>
    <p-toggleswitch [(ngModel)]="darkMode" (onChange)="toggleDarkMode()" />
  </ng-template>
</p-menubar>
