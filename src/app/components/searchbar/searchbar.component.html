<form class="search-container" role="search">
  <div class="search-wrapper">
    <div class="search-icon" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </div>

    <label for="searchInput" class="sr-only">Rechercher une émotion</label>

    <input 
  id="searchInput"
  name="search"
  type="text"
  class="search-input"
  placeholder="{{ placeholder }}"
  [(ngModel)]="searchQuery"
  (input)="onSearchInput($event)"
  (keydown)="onKeyDown($event)"
  (focus)="onFocus()"
  autocomplete="off"
  aria-describedby="searchDescription"
>

 <div aria-live="polite" aria-atomic="true" class="sr-only" id="searchDescription">
  {{ ariaMessage }}
</div>

  </div>

  <div 
    class="search-results"
    [class.show]="showResults && searchQuery.trim().length >= minSearchLength && (filteredResults.length > 0 || searchQuery.trim().length > 0)"
    aria-live="polite"
    role="region"
    aria-label="Résultats de recherche"
  >
    @if (filteredResults.length === 0 && searchQuery.trim().length >= minSearchLength) {
      <div class="no-results" role="alert">
        Aucun résultat trouvé
      </div>
    }

    @if (filteredResults.length > 0) {
      <ul class="results-list" role="list">
        @for (result of filteredResults; track result.id; let i = $index) {
          <li 
            class="search-result-item"
            [class.selected]="selectedIndex === i"
            (click)="selectResult(result)"
            (mouseenter)="selectedIndex = i"
            tabindex="0"
            role="listitem"
            (keydown.enter)="selectResult(result)"
          >
            <div class="result-title" [innerHTML]="highlightText(result.title, searchQuery)"></div>
            <div class="result-description" [innerHTML]="highlightText(result.description, searchQuery)"></div>
          </li>
        }
      </ul>
    }
  </div>
</form>
