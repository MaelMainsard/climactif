<app-refresh-title>Partage</app-refresh-title>

<h1 style="margin: 1rem">Partage</h1>
<section>
  <p-button id="openDialogBtn" (click)="showDialog()" label="Partager mon ressenti du jour" tabindex="0"></p-button>
</section>
<p-dialog
  [(visible)]="visible"
  [modal]="true"
  (onHide)="onDialogHide()"
  [style]="{ width: '30rem', margin: '1rem' }"
  [contentStyle]="{ padding: '0' }"
  styleClass="!border-0 !bg-transparent"
  maskStyleClass="backdrop-blur-sm"
>
  <ng-template #headless>
    <app-mood-form (save)="saveMood($event)" (cancel)="visible = false"> </app-mood-form>
  </ng-template>
</p-dialog>
