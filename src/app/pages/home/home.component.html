<h1>Home</h1>
<p-button (click)="showDialog()" label="What's your mood ?"></p-button>
<p-dialog
  header="How are you feeling?"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '30rem' }"
>
  <app-mood-form
    (save)="saveMood($event)"
    (cancel)="visible = false"
  ></app-mood-form>
</p-dialog>
