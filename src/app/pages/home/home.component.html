<app-refresh-title />

<h1>Accueil</h1>
<section>
  <p-button (click)="showDialog()" label="Partager mon ressenti du jour"></p-button>
  <h2>La météo intérieure d'aujourd'hui</h2>
</section>
<p-dialog
  [(visible)]="visible"
  [style]="{ width: '30rem' }"
  [contentStyle]="{ padding: '0' }"
  styleClass="!border-0 !bg-transparent"
  maskStyleClass="backdrop-blur-sm"
>
  <ng-template #headless>
    <app-mood-form (save)="saveMood($event)" (cancel)="visible = false"> </app-mood-form>
  </ng-template>
</p-dialog>
