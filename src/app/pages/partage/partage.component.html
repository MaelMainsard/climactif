<h1 class="my-4 text-2xl sm:text-3xl">Partageons notre météo intérieure</h1>
<p class="max-w-xl mx-auto text-center mb-5">
  ClimActif est une communauté bienveillante où chacun peut exprimer ses ressentis et découvrir l'humeur collective de notre époque.
</p>

<section>
  <p-button id="openDialogBtn" (click)="showDialog()" label="Partager mon ressenti du jour"></p-button>
</section>
<p-dialog
  [(visible)]="visible"
  [modal]="true"
  (onHide)="onDialogHide()"
  [style]="{ width: '30rem', margin: '1rem' }"
  [contentStyle]="{ padding: '0' }"
  styleClass="!border-0 !bg-transparent"
  maskStyleClass="backdrop-blur-sm"
>
  <ng-template #headless>
    <app-mood-form (save)="saveMood($event)" (cancel)="visible = false"> </app-mood-form>
  </ng-template>
</p-dialog>
